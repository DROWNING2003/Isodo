name: Desktop macOS build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-macos.yml'
      - 'app/**'
      - 'cmd/isodo-node/**'
      - 'cmd/isodo-guest/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15-arm64
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.10.0 --activate
      - name: Install workspace dependencies
        run: cd app && pnpm install --frozen-lockfile
      - name: Build desktop test artifact
        run: bash scripts/package-desktop-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: isodo-desktop-macos-arm64-${{ github.sha }}
          path: dist/desktop/*.zip
          if-no-files-found: error
          retention-days: 7
