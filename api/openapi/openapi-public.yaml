      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionRule"
        default:
          description: 请求、认证或服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInjectionRule"
    delete:
      operationId: DeleteInjectionRule
      summary: 删除账号凭证注入规则
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
