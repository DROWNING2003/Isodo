                $ref: "#/components/schemas/Error"
  /v1/injection-rules/{ruleID}/material:
    parameters:
      - name: ruleID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetInjectionRuleMaterial
      summary: 读取凭证注入材料
      description: 为已认证所有者返回明文请求头或密钥，以供受信任的本地运行时应用。响应禁止缓存，秘密不得写入日志。
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionRuleMaterial"
        default:
          description: 请求、认证或服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/system-templates:
    get:
      operationId: ListSystemTemplates
      summary: 列出平台默认模板
      tags:
        - 模板管理
      security: &a1
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        default: &a2
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - &a3
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - &a4
          name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
  /v1/templates:
    get:
      operationId: ListTemplates
      summary: 列出当前用户可见的模板
      tags:
        - 模板管理
      security: *a1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        default: *a2
      parameters:
        - *a3
        - *a4
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - owned
              - public
              - system
              - available
            default: owned
    post:
      operationId: CreateTemplate
      summary: 创建个人模板
      tags:
        - 模板管理
      security: *a1
      responses:
        "201":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplate"
  /v1/templates/{templateID}:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetTemplate
      summary: 查询模板
      tags:
        - 模板管理
      security: *a1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
    patch:
      operationId: UpdateTemplate
      summary: 更新本人拥有的模板
      tags:
        - 模板管理
      security: *a1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTemplate"
    delete:
      operationId: DeleteTemplate
      summary: 删除本人拥有的模板
      tags:
        - 模板管理
      security: *a1
      responses:
        "204":
          description: 请求成功
        default: *a2
  /v1/templates/{templateID}/builds:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: CreateTemplateBuild
      summary: 提交不可变模板构建任务
      tags:
        - 模板管理
      security: *a1
      responses:
        "202":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateBuild"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRecipe"
  /v1/templates/{templateID}/builds/{buildID}:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
      - name: buildID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetTemplateBuild
      summary: 查询模板构建状态
      tags:
        - 模板管理
      security: *a1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateBuild"
        default: *a2
  /v1/templates/{templateID}/tags/{tag}:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
      - name: tag
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetTemplateTag
      summary: 解析 Ready 构建标签
      tags:
        - 模板管理
      security: *a1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateTag"
        default: *a2
    put:
      operationId: SetTemplateTag
      summary: 将 Ready 构建原子发布至标签
      tags:
        - 模板管理
      security: *a1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateTag"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTemplateTag"
    delete:
      operationId: DeleteTemplateTag
      summary: 移除模板构建标签
      tags:
        - 模板管理
      security: *a1
      responses:
        "204":
          description: 请求成功
        default: *a2
  /v1/templates/{templateID}/fork:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: ForkTemplate
      summary: 从可访问的 Ready 构建派生个人模板
      tags:
        - 模板管理
      security: *a1
      responses:
        "201":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkTemplate"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: isodo_session
    BearerAuth:
      type: http
      scheme: bearer
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    FileMetadata:
      type: object
      required: [path, name, kind, size_bytes, mode, modified_at]
      properties:
        path: {type: string}
        name: {type: string}
        kind: {type: string, enum: [regular, directory, symlink]}
        size_bytes: {type: integer, format: int64, minimum: 0}
        mode: {type: integer, minimum: 0, maximum: 511, description: 以十进制整数表示的 Unix 权限位}
        modified_at: {type: string, format: date-time}
        symlink_target: {type: string, description: 符号链接的原始元数据，不通过链接访问工作区外路径}
    FileDirectoryPage:
      type: object
      required: [entries, next_page_token]
      properties:
        entries: {type: array, items: {$ref: "#/components/schemas/FileMetadata"}}
        next_page_token: {type: string, description: 没有后续条目时为空}
    SkillCreate:
      type: object
      additionalProperties: false
      required: [name, description, body]
      properties:
        name: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
        description: {type: string, minLength: 1, maxLength: 1024}
        body: {type: string, minLength: 1, maxLength: 32768}
    SkillEntry:
      allOf:
        - {$ref: '#/components/schemas/SkillCreate'}
        - type: object
          required: [id, source, favorite]
          properties:
            id: {type: string, format: uuid}
            source: {type: string, enum: [market, personal]}
            favorite: {type: boolean}
    SkillCatalog:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SkillEntry'}}
    SkillSelectionInput:
      type: object
      additionalProperties: false
      required: [skill_ids]
      properties:
        skill_ids: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, format: uuid}}
    SkillSelection:
      allOf:
        - {$ref: '#/components/schemas/SkillSelectionInput'}
        - type: object
          required: [version, applied_version, sync_status, restart_required]
          properties:
            version: {type: integer, format: int64}
            applied_version: {type: integer, format: int64}
            sync_status: {type: string, enum: [pending, applied, failed]}
            restart_required: {type: boolean}

    CustomMCPCreate:
      type: object
      additionalProperties: false
      required: [name, endpoint, auth_kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 240}
        endpoint: {type: string, format: uri, maxLength: 2048}
        auth_kind: {type: string, enum: [none, bearer]}
        token: {type: string, maxLength: 4096, writeOnly: true}
    MCPCatalogEntry:
      type: object
      required:
        [
          market_mcp_id,
          name,
          provider,
          description,
          endpoint,
          transport,
          auth_kind,
          favorite,
          status,
          oauth_configured
        ]
      properties:
        market_mcp_id: {type: string}
        name: {type: string}
        provider: {type: string}
        description: {type: string}
        endpoint: {type: string}
        transport: {type: string, enum: [streamable-http]}
        auth_kind: {type: string, enum: [oauth2, none, bearer]}
        source: {type: string, enum: [market, custom]}
        custom_server_id: {type: string, format: uuid}
        favorite: {type: boolean}
        status: {type: string, enum: [connected, expired, disconnected, failed]}
        oauth_connection_id: {type: string, nullable: true}
        oauth_configured: {type: boolean}
        workspace_id: {type: string, nullable: true}
        workspace_name: {type: string, nullable: true}
    MCPCatalogList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MCPCatalogEntry'}}
    MCPTool:
      type: object
      required: [name, inputSchema]
      properties:
        name: {type: string}
        description: {type: string}
        inputSchema: {type: object, additionalProperties: true}
    MCPToolList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MCPTool'}}
    MCPOAuthConnection:
      type: object
      required: [status]
      properties:
        market_mcp_id: {type: string}
        oauth_connection_id: {type: string}
        status: {type: string, enum: [connected, expired, disconnected, failed]}
        tools: {type: array, items: {$ref: '#/components/schemas/MCPTool'}}
        expires_at: {type: string, format: date-time, nullable: true}
    MCPOAuthStart:
      type: object
      required: [transaction_id, authorization_url, expires_at]
      properties:
        transaction_id: {type: string}
        authorization_url: {type: string}
        expires_at: {type: string, format: date-time}
    MCPOAuthTransaction:
      type: object
      required: [transaction_id, status, expires_at]
      properties:
        transaction_id: {type: string}
        status: {type: string, enum: [pending, processing, connected, failed, cancelled, expired]}
        expires_at: {type: string, format: date-time}
    MCPBinding:
      type: object
      required: [sandbox_binding_id, market_mcp_id, sync_status, status]
      properties:
        sandbox_binding_id: {type: string}
        market_mcp_id: {type: string}
        oauth_connection_id: {type: string}
        custom_server_id: {type: string, format: uuid}
        sync_status: {type: string, enum: [pending, applied, failed]}
        status: {type: string, enum: [connected, expired, disconnected, failed]}
    MCPBindingList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MCPBinding'}}
    MCPSync:
      type: object
      required: [sync_status, restart_required]
      properties:
        sync_status: {type: string, enum: [pending, applied, failed]}
        restart_required: {type: boolean}
        message: {type: string}
    PortPreviewPolicy:
      type: object
      additionalProperties: false
      required: [visibility]
      properties:
        visibility: {type: string, enum: [public, private], default: public}
    FileWriteResult:
      type: object
      required: [path, bytes, sha256]
      properties:
        path: {type: string}
        bytes: {type: integer, format: int64}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    SandboxInjection:
      type: object
      required: [key, name, kind, spec]
      properties:
        key: {type: string}
        name: {type: string}
        kind: {type: string, enum: [persistent, one-off]}
        persistent_id: {type: string}
        secret_hint: {type: string, readOnly: true}
        spec:
          type: object
          required: [type]
          properties:
            type: {$ref: "#/components/schemas/InjectionRuleType"}
            base_url: {type: string}
            header_name: {type: string}
            if_headers: {type: object, additionalProperties: {type: string}}
            if_queries: {type: object, additionalProperties: {type: string}}
        secret:
          type: object
          writeOnly: true
          properties:
            api_key: {type: string}
            token: {type: string}
            headers: {type: object, additionalProperties: {type: string}}
    SandboxInjectionState:
      type: object
      required: [rules, enabled, stats]
      properties:
        rules: {type: array, items: {$ref: "#/components/schemas/SandboxInjection"}}
        enabled: {type: boolean}
        stats:
          type: object
          required: [injected]
          properties:
            injected: {type: integer, format: int64}
    CommandRunRequest:
      type: object
      additionalProperties: false
      required: [argv]
      properties:
        argv: {type: array, minItems: 1, maxItems: 256, items: {type: string}}
        cwd: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        timeout_seconds: {type: integer, minimum: 0, maximum: 300, default: 60}
    CommandRunResult:
      type: object
      additionalProperties: false
      required: [execution_id, stdout, stderr, exit_code, reason, output_incomplete]
      properties:
        execution_id: {type: string}
        stdout: {type: string}
        stderr: {type: string}
        exit_code: {type: integer, format: int32, nullable: true}
        reason: {type: string}
        output_incomplete: {type: boolean}
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            field:
              type: string
          required:
            - code
            - message
      required:
        - error
    Metadata:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
    SandboxDesiredState:
      type: string
      enum: [running, stopped]
    SandboxObservedState:
      type: string
      enum: [requested, preparing, starting, running, stopping, stopped, error, unknown]
    SandboxAction:
      type: object
      additionalProperties: false
      required: [revision, type, status, updated_at]
      properties:
        revision:
          type: string
          pattern: '^[1-9][0-9]*$'
        type:
          type: string
          enum: [create, start, stop, delete]
        status:
          type: string
          enum: [accepted, running, succeeded, failed, superseded]
        stage:
          type: string
        error:
          $ref: '#/components/schemas/ActionError'
        updated_at:
          type: string
          format: date-time
    ActionError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
    SandboxDeletion:
      type: object
      additionalProperties: false
      required: [requested_at]
      properties:
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    SandboxResources:
      type: object
      properties:
        vcpu:
          type: integer
        memory_bytes:
          type: integer
          format: int64
        disk_bytes:
          type: integer
          format: int64
    Sandbox:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          x-go-name: ID
        name:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        template_id:
          type: string
          x-go-name: TemplateID
        template_build_id:
          type: string
          x-go-name: TemplateBuildID
        template_digest:
          type: string
        revision:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: 生命周期意图的 revision。仅修改名称或元数据不会改变此值。
        last_action:
          $ref: '#/components/schemas/SandboxAction'
        deletion:
          $ref: '#/components/schemas/SandboxDeletion'
        observed_at:
          type: string
          format: date-time
        runtime_id:
          type: string
          description: 当前运行实例的不透明标识，由运行时分配，客户端不能指定。
        resources:
          $ref: "#/components/schemas/SandboxResources"
        desired_state:
          $ref: "#/components/schemas/SandboxDesiredState"
        observed_state:
          $ref: "#/components/schemas/SandboxObservedState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - metadata
        - desired_state
        - observed_state
        - created_at
        - updated_at
    CreateSandbox:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        template:
          type: string
          description: 系统模板目录名或模板 UUID，可附加 :tag。默认 base:default，创建时解析并固定为不可变 build。
          example: base
        metadata:
          $ref: "#/components/schemas/Metadata"
          x-go-type-skip-optional-pointer: true
    PatchSandbox:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        metadata:
          $ref: "#/components/schemas/Metadata"
    SandboxList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sandbox"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
    SandboxAppLink:
      type: object
      additionalProperties: false
      properties:
        sandbox_id:
          type: string
        service:
          type: string
          enum:
            - t3
          description: 此链接访问的 Guest 服务名称
        url:
          type: string
          format: uri
          description: 应用基础 URL。客户端必须将其视为不透明地址，不自行构造或改写。
        pairing_url:
          type: string
          format: uri
          description: 可直接打开的 URL，其 fragment 携带短期 Agent 工作台配对凭证。
        status:
          type: string
          enum:
            - ready
            - pending
            - stopped
            - failed
            - unsupported
        expires_at:
          type: string
          format: date-time
        generation:
          type: string
          description: 不透明的运行时 generation。存在时链接只对该 generation 有效；停止、启动或恢复后会改变。客户端不得解析此值。
        capabilities:
          type: array
          items:
            type: string
          description: 该应用链接提供的能力名称，例如 terminal 和 files；客户端应将未知能力视为可选项。
      required:
        - sandbox_id
        - service
        - url
        - pairing_url
        - status
        - expires_at
    InjectionRuleType:
      type: string
      enum:
        - http
        - mcp
        - openai
        - anthropic
        - gemini
        - qiniu
        - github
    InjectionRule:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/InjectionRuleType"
        base_url:
          type: string
        header_name:
          type: string
        if_headers:
          type: object
          additionalProperties:
            type: string
        if_queries:
          type: object
          additionalProperties:
            type: string
        secret_set:
          type: boolean
        secret_hint:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - secret_set
        - secret_hint
        - created_at
        - updated_at
    CreateInjectionRule:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          $ref: "#/components/schemas/InjectionRuleType"
        base_url:
          type: string
          maxLength: 2048
        header_name:
          type: string
          maxLength: 128
        if_headers:
          type: object
          additionalProperties:
            type: string
        if_queries:
          type: object
          additionalProperties:
            type: string
        secret:
          type: string
          minLength: 1
          maxLength: 8192
      required:
        - name
        - type
        - secret
    PatchInjectionRule:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
          maxLength: 2048
        header_name:
          type: string
          maxLength: 128
        if_headers:
          type: object
          additionalProperties:
            type: string
        if_queries:
          type: object
          additionalProperties:
            type: string
        secret:
          type: string
          maxLength: 8192
    InjectionRuleList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InjectionRule"
        total:
          type: integer
          format: int64
      required:
        - items
        - total
    InjectionRuleMaterial:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/InjectionRuleType"
        base_url:
          type: string
        header_name:
          type: string
        if_headers:
          type: object
          additionalProperties:
            type: string
        if_queries:
          type: object
          additionalProperties:
            type: string
        api_key:
          type: string
        token:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
      required:
        - id
        - type
    Template:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          x-go-name: ID
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum:
            - system
            - personal
        visibility:
          type: string
          enum:
            - private
            - public
        owned:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
