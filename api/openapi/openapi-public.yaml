openapi: 3.0.3
info:
  title: Isodo 公开 API
  version: 0.1.0
  description: 沙箱接口支持登录会话、Casdoor Bearer Token 和带权限范围的 API Key。MCP 账号操作需要交互式账号认证；一次性 OAuth 回调供浏览器访问。
servers:
  - url: https://api.drowning.top:18443
    description: Isodo 托管 HTTPS API
paths:
  /v1/skills:
    get:
      operationId: ListSkills
      tags: [Skill 市场]
      summary: 列出平台与本人私有 Skill
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillCatalog"}
        default:
          description: 账号会话认证失败或请求错误；不接受沙箱 API Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    post:
      operationId: CreateSkill
      tags: [Skill 市场]
      summary: 制作个人 Skill（指令正文，自动收藏）
      security: [{SessionCookie: []}, {BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkillCreate"}
      responses:
        '201':
          description: 请求成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillEntry"}
        default:
          description: 账号会话认证失败或请求错误；不接受沙箱 API Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/skills/{skillID}/favorite:
    put:
      operationId: FavoriteSkill
      tags: [Skill 市场]
      summary: 收藏 Skill
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: skillID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: 请求成功
        default:
          description: 账号会话认证失败或请求错误；不接受沙箱 API Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: UnfavoriteSkill
      tags: [Skill 市场]
      summary: 取消收藏（不自动移除沙箱中的 Skill）
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: skillID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: 请求成功
        default:
          description: 账号会话认证失败或请求错误；不接受沙箱 API Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/skills:
    get:
      operationId: GetSandboxSkills
      tags: [Skill 市场]
      summary: 读取沙箱 Skill 选择与同步状态
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillSelection"}
        default:
          description: 账号会话认证失败或请求错误；不接受沙箱 API Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      operationId: SetSandboxSkills
      tags: [Skill 市场]
      summary: 保存完整 Skill 选择并同步；停止状态保留为 pending
      description: 最多 32 个 Skill，合计序列化内容不超过 96 KiB。返回 applied 仅代表文件已同步，新 Agent 任务加载。
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkillSelectionInput"}
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillSelection"}
        '202':
          description: 已保存；运行时同步尚未完成或失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillSelection"}
        default:
          description: 账号会话认证失败或请求错误；不接受沙箱 API Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/oauth/callback:
    get:
      operationId: CompleteMCPOAuth
      summary: 完成浏览器中的一次性 MCP OAuth 回调
      description: 固定 HTTPS 回调。state 绑定账号和 PKCE 事务；不接受 Isodo API Key，也不返回 OAuth 令牌。查询参数不得写入日志。
      tags: [MCP 市场]
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
        - {name: iss, in: query, schema: {type: string}}
      responses:
        '200':
          description: 授权与工具发现完成，可返回应用
          content:
            text/plain:
              schema: {type: string}
        default:
          description: state 无效、过期、被重放，或第三方授权失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/mcp/custom:
    post:
      tags: [MCP 市场]
      operationId: CreateCustomMCP
      security: [{SessionCookie: []}, {BearerAuth: []}]
      summary: 添加账号私有 HTTPS MCP 并验证工具发现
      description: 仅登录会话；支持无认证和 Bearer Token。Token 仅加密保存在 Control，不返回或传入 Guest。只允许公网 HTTPS 443，拒绝重定向、内网与 DNS 重绑定。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomMCPCreate'}
      responses:
        '201':
          description: 已验证并保存私有 MCP
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPCatalogEntry'}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/mcp/custom/{customID}:
    parameters:
      - {name: customID, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [MCP 市场]
      operationId: DeleteCustomMCP
      security: [{SessionCookie: []}, {BearerAuth: []}]
      summary: 删除自己的私有 MCP 并撤销全部沙箱绑定
      responses:
        '204': {description: 已删除或已不存在}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/mcp/catalog:
    get:
      operationId: ListMCPCatalog
      summary: 列出可用的 MCP 服务
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: 列出可用的 MCP 服务
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPCatalogList"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/catalog/{marketID}:
    get:
      operationId: GetMCPCatalog
      summary: 查询 MCP 服务详情
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 查询 MCP 服务详情
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPCatalogList"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/favorites:
    get:
      operationId: ListMCPFavorites
      summary: 列出账号收藏的 MCP
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: 列出账号收藏的 MCP
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPCatalogList"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/favorites/{marketID}:
    put:
      operationId: FavoriteMCP
      summary: 收藏 MCP 服务
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: 收藏 MCP 服务
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: UnfavoriteMCP
      summary: 取消收藏，保留现有 OAuth 授权
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: 取消收藏，保留现有 OAuth 授权
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/connections/{marketID}:
    get:
      operationId: GetMCPOAuthConnection
      summary: 查询连接状态（不返回秘密）
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 查询连接状态（不返回秘密）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPOAuthConnection"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: DisconnectMCPOAuth
      summary: 断开连接并禁止后续沙箱调用
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: 断开连接并禁止后续沙箱调用
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/connections/{marketID}/authorize:
    post:
      operationId: StartMCPOAuth
      summary: 使用 PKCE 和供应方注册信息连接官方 MCP
      description: GitHub 使用预注册的 GitHub App；Notion 发现 OAuth 元数据并通过 DCR 注册，使用 PKCE S256。不使用 PAT 或 CIMD 回退。
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 使用已注册应用和 PKCE 发起或重新发起授权
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPOAuthStart"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/connections/{marketID}/tools:
    get:
      operationId: ListMCPTools
      summary: 查询允许使用的上游工具
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 查询允许使用的上游工具
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPToolList"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/oauth/transactions/{transactionID}:
    get:
      operationId: GetMCPOAuthTransaction
      summary: 查询账号授权事务状态
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: transactionID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 查询账号授权事务状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPOAuthTransaction"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: CancelMCPOAuthTransaction
      summary: 取消授权事务
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: transactionID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: 取消授权事务
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/mcp:
    get:
      operationId: ListSandboxMCPBindings
      summary: 列出沙箱显式授权的 MCP 绑定
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 列出沙箱显式授权的 MCP 绑定
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPBindingList"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/mcp/{marketID}:
    put:
      operationId: BindSandboxMCP
      summary: 绑定已授权 MCP 并同步 Codex 配置
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 绑定已授权 MCP 并同步 Codex 配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        "202":
          description: 绑定已保存，但配置仍待同步或同步失败；可重试同步
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: UnbindSandboxMCP
      summary: 先撤销沙箱绑定，再同步配置
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 先撤销沙箱绑定，再同步配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        "202":
          description: 绑定已保存，但配置仍待同步或同步失败；可重试同步
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/mcp/{marketID}/sync:
    post:
      operationId: SyncSandboxMCP
      summary: 应用已保存的 MCP 配置；新 Agent 会话加载更改
      tags: [MCP 市场]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 应用已保存的 MCP 配置；新 Agent 会话加载更改
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        "202":
          description: 绑定已保存，但配置仍待同步或同步失败；可重试同步
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/files:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
      - {name: path, in: query, required: true, schema: {type: string}, description: /workspace 内的规范绝对路径}
    post:
      operationId: UploadSandboxFile
      summary: 上传并原子提交文件
      description: 默认 overwrite=true。请求包含名为 file 的单个 multipart 文件部分，最大 256 MiB。上传内容先在有界私有临时空间暂存，再经 Node 转发至 Guest。成功代表 Guest
        已确认 SHA-256 和原子提交。遇到 COMMIT_UNKNOWN 时应先读取目标文件确认结果，再决定是否重试。
      tags: [工作区文件]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      parameters:
        - {name: overwrite, in: query, schema: {type: boolean, default: true}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: Guest 已确认文件原子提交
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileWriteResult"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      operationId: DownloadSandboxFile
      summary: 下载经过完整性校验的文件
      description: 在私有临时空间暂存最多 256 MiB，校验 Guest 完成摘要后再返回响应。X-Content-SHA256 表示完整响应体的摘要。
      tags: [工作区文件]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      responses:
        "200":
          description: 经过校验的二进制文件内容
          headers:
            X-Content-SHA256: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: RemoveSandboxFile
      summary: 删除工作区文件或目录
      description: 不存在的路径也视为成功。符号链接只删除链接本身；空目录可直接删除，非空目录要求 recursive=true，最多处理 4096 个条目。禁止删除工作区根目录和运行时保护路径，拒绝符号链接父目录。
      tags: [工作区文件]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      parameters:
        - {name: recursive, in: query, schema: {type: boolean, default: false}}
      responses:
        "204":
          description: 请求成功
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/directories:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    post:
      operationId: MakeSandboxDirectory
      summary: 创建工作区目录
      tags: [工作区文件]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
                parents: {type: boolean, default: true}
      responses:
        "200":
          description: 目录已存在或已创建
          content:
            application/json:
              schema: {type: object, required: [path], properties: {path: {type: string}}}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      operationId: ListSandboxDirectory
      summary: 列出工作区目录
      description: 按名称字典序返回条目。page_size 默认 100、最大 500；将 next_page_token 原样传回 page_token。令牌是名称游标，不保证并发修改下的一致性快照。单目录最多 4096
        个条目；返回最终符号链接的元数据，不跟随该链接。
      tags: [工作区文件]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      parameters:
        - {name: path, in: query, required: true, schema: {type: string}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: page_token, in: query, schema: {type: string, maxLength: 1024}}
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileDirectoryPage"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/files/stat:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
      - {name: path, in: query, required: true, schema: {type: string}, description: /workspace 内的规范绝对路径}
    get:
      operationId: StatSandboxFile
      summary: 查询工作区路径元数据
      description: 返回 lstat 元数据；最终路径为符号链接时包含 symlink_target，不跟随该链接。允许查询 /workspace 本身，拒绝工作区外的路径。
      tags: [工作区文件]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileMetadata"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/files/move:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    post:
      operationId: MoveSandboxFile
      summary: 移动工作区文件或目录
      description: 默认 overwrite=true，与文件上传一致。只有普通文件可以覆盖已有普通文件，不覆盖目录。overwrite=false
        使用原子禁止覆盖操作。源和目标都必须是工作区内的规范路径；禁止工作区根、运行时保护路径和符号链接父目录。源和目标相同时返回当前元数据。
      tags: [工作区文件]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, destination]
              properties:
                source: {type: string}
                destination: {type: string}
                overwrite: {type: boolean, default: true}
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileMetadata"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/injections:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    get:
      operationId: GetSandboxInjections
      summary: 读取脱敏后的沙箱凭证注入配置
      tags: [沙箱管理]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: 脱敏配置，不包含秘密材料
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SandboxInjectionState"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      operationId: SetSandboxInjections
      summary: 替换沙箱的宿主侧凭证注入规则
      description: 需要所有者的交互式授权。秘密材料仅通过 Node mTLS 传递，不写入 Guest 文件。Control 和 Node 均校验生命周期 revision。
      tags: [沙箱管理]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules: {type: array, maxItems: 32, items: {$ref: "#/components/schemas/SandboxInjection"}}
      responses:
        "200":
          description: 已应用的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SandboxInjectionState"}
        default:
          description: 请求失败
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/credential-documents/{kind}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string}}
    get:
      operationId: ListCredentialDocuments
      summary: 列出账号加密保存的凭证配置文档
      description: 需要交互式登录。kind 为 agents 或 sandboxes，只有所属账号可以解密读取配置内容。
      tags: [凭证配置]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: 当前账号拥有的配置
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, value]
                      properties:
                        id: {type: string}
                        value: {type: object, additionalProperties: true}
        default:
          description: 认证、参数校验或存储错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/credential-documents/{kind}/{id}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string}}
      - {name: id, in: path, required: true, schema: {type: string, maxLength: 160}}
    put:
      operationId: PutCredentialDocument
      summary: 保存账号 Agent 配置或沙箱凭证选择
      description: Agent 配置包含 id、name、agent、connectionId、modelNames、defaultModel、filePath、content、updatedAt。沙箱配置包含
        agentIds、credentialIds 和已应用的模型快照。所引用的 Agent 必须属于当前账号，API Key 不能管理这些记录。
      tags: [凭证配置]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: 配置已加密持久化
          content:
            application/json:
              schema:
                type: object
                required: [id, value]
                properties:
                  id: {type: string}
                  value: {type: object, additionalProperties: true}
        default:
          description: 认证、参数校验或存储错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: DeleteCredentialDocument
      summary: 删除当前账号的一份配置
      tags: [凭证配置]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "204": {description: 配置已删除，保留其引用的 API 凭证}
        default:
          description: 认证、参数校验或存储错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes:
    get:
      operationId: ListSandboxes
      summary: 列出沙箱
      description: 返回当前认证用户拥有的沙箱，使用 limit 和 offset 分页。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxList"
        default:
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
    post:
      operationId: CreateSandbox
      summary: 创建沙箱
      description: 为当前认证用户创建沙箱并登记初始期望状态。运行时可用性取决于已配置的后端；应继续查询实际运行状态。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandbox"
  /v1/sandboxes/{sandboxID}:
    get:
      operationId: GetSandbox
      summary: 查询沙箱
      description: 返回当前用户拥有的一个沙箱；其他用户的沙箱统一返回未找到。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
    patch:
      operationId: UpdateSandbox
      summary: 更新沙箱信息
      description: 更新当前用户所拥有沙箱的可变名称和元数据。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSandbox"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: DeleteSandbox
      summary: 删除沙箱
      description: 请求 Node 清理资源。清理完成前资源仍可读取；重复删除返回同一删除动作的当前结果。不存在的资源返回 204。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: 已接受清理请求，或返回当前清理结果
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "204":
          description: 沙箱不存在
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/start:
    post:
      operationId: StartSandbox
      summary: 启动已停止的沙箱
      description: 对当前用户拥有且已停止的云端沙箱执行保留磁盘的冷启动。这是异步操作，应轮询直至 observed_state 为 running。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: 已接受启动请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/stop:
    post:
      operationId: StopSandbox
      summary: 停止运行中的沙箱
      description: 优雅停止当前用户拥有的云端沙箱并保留实例磁盘。这是异步操作，应轮询直至 observed_state 为 stopped。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: 已接受停止请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/app:
    get:
      operationId: GetSandboxApp
      summary: 打开沙箱应用
      description: 为已认证的沙箱所有者创建短期 Agent 工作台配对链接，并将浏览器重定向至沙箱应用。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "303":
          description: 重定向至 Agent 工作台配对页面；短期配对凭证放在 URL fragment 中。
          headers:
            Location:
              schema:
                type: string
        "401":
          description: 需要身份认证
        "403":
          description: 需要交互式 Isodo 登录会话
        "404":
          description: 未找到沙箱
        "409":
          description: 沙箱未运行
        "501":
          description: 当前沙箱后端不支持应用链接
        "502":
          description: Node 返回了无效或无法访问的应用链接
        "503":
          description: 沙箱应用服务暂不可用
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/app-link:
    post:
      operationId: CreateSandboxAppLink
      summary: 获取沙箱应用链接
      description: 为已认证的沙箱所有者创建短期 Agent 工作台配对链接，并返回 JSON。桌面客户端使用此接口；浏览器也可访问 GET /v1/sandboxes/{sandboxID}/app。配对凭证位于
        pairing_url 的 fragment 中，不通过该链接发送至 Isodo API。
      tags:
        - 沙箱管理
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 沙箱应用入口与配对链接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxAppLink"
        "401":
          description: 需要身份认证
        "403":
          description: 需要交互式 Isodo 登录会话
        "404":
          description: 未找到沙箱
        "409":
          description: 沙箱未运行
        "501":
          description: 当前沙箱后端不支持应用链接
        "502":
          description: Node 返回了无效或无法访问的应用链接
        "503":
          description: 沙箱应用服务暂不可用
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/previews:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    post:
      operationId: CreateSandboxPreview
      summary: 获取沙箱 HTTP 端口预览入口
      description: 需要运行中的远程 CHV 沙箱；API Key 需要 sandboxes:preview。未配置的端口默认为 public，返回可直接访问的 URL。private 端口返回有效期五分钟、绑定账号、策略
        revision 和当前 Guest 运行身份的 authorization_url。禁止访问运行时端口 31024、31080、38080 及旧端口 1024、1080、8080。启停、删除和策略变化会撤销私有授权。
      tags: [Previews]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              additionalProperties: false
              properties:
                port: {type: integer, minimum: 1, maximum: 65535}
      responses:
        "201":
          description: public 端口返回可直接访问的 url。private 端口额外返回短期 authorization_url 和 expires_at；authorization_url 属于秘密，不应泄露。
          content:
            application/json:
              schema:
                type: object
                required: [url, visibility]
                properties:
                  visibility: {type: string, enum: [public, private]}
                  url: {type: string, format: uri}
                  authorization_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        default:
          description: 认证、端口校验或运行时错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/previews/{port}:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
      - {name: port, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 65535}}
    get:
      operationId: GetSandboxPortPreview
      summary: 查询 HTTP 端口可见性
      description: 需要沙箱所有权和 sandboxes:read。未配置的端口默认为 public。禁止使用运行时端口 31024、31080、38080 及旧端口 1024、1080、8080。
      tags: [Previews]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      responses:
        "200":
          description: 已持久化的端口策略，或默认 public 策略
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortPreviewPolicy"}
        default:
          description: 请求、资源归属或存储错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      operationId: SetSandboxPortPreview
      summary: 修改 HTTP 端口可见性
      description: 需要沙箱所有权和 sandboxes:preview。策略在停止、启动后保留，删除沙箱时清理。新请求读取已提交的策略；确认切换前取消本 Gateway 的活动流，其他 Gateway 最迟每 100ms
        重新校验。T3 工作台鉴权保持不变。
      tags: [Previews]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PortPreviewPolicy"}
      responses:
        "200":
          description: 已持久化的端口策略
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortPreviewPolicy"}
        default:
          description: 请求、资源归属或存储错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/commands/run:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    post:
      operationId: RunSandboxCommand
      summary: 在沙箱 Guest 内执行命令
      description: 在运行中的 Guest 内执行 argv，不在宿主 Shell 执行。必须提供 8–128 个安全 ASCII 字符组成的 Idempotency-Key；同一请求重试时复用该键。命令以非零退出码结束时，HTTP
        仍返回 200，应检查 exit_code。
      tags: [Commands]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandRunRequest"}
      responses:
        "200":
          description: Guest 已完成命令并返回退出状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandRunResult"}
        default:
          description: 认证、命令执行或运行时错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/injection-rules:
