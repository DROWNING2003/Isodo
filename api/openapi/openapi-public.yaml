openapi: 3.0.3
info:
  title: Isodo Public API
  version: 0.1.0
  description: Sandbox APIs support sessions, Casdoor bearer tokens and scoped API keys. MCP account operations require interactive account authentication; the one-time OAuth callback is browser-facing.
paths:
  /v1/skills:
    get:
      operationId: ListSkills
      tags: [Skills]
      summary: 列出平台与本人私有 Skill
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillCatalog"}
        default:
          description: Error; account session required, scoped Sandbox API keys rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    post:
      operationId: CreateSkill
      tags: [Skills]
      summary: 制作个人 Skill（指令正文，自动收藏）
      security: [{SessionCookie: []}, {BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkillCreate"}
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillEntry"}
        default:
          description: Error; account session required, scoped Sandbox API keys rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/skills/{skillID}/favorite:
    put:
      operationId: FavoriteSkill
      tags: [Skills]
      summary: 收藏 Skill
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: skillID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Success
        default:
          description: Error; account session required, scoped Sandbox API keys rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: UnfavoriteSkill
      tags: [Skills]
      summary: 取消收藏（不自动移除沙箱中的 Skill）
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: skillID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Success
        default:
          description: Error; account session required, scoped Sandbox API keys rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/skills:
    get:
      operationId: GetSandboxSkills
      tags: [Skills]
      summary: 读取沙箱 Skill 选择与同步状态
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillSelection"}
        default:
          description: Error; account session required, scoped Sandbox API keys rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      operationId: SetSandboxSkills
      tags: [Skills]
      summary: 保存完整 Skill 选择并同步；停止状态保留为 pending
      description: 最多 32 个 Skill，合计序列化内容不超过 96 KiB。返回 applied 仅代表文件已同步，新 Agent 任务加载。
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkillSelectionInput"}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillSelection"}
        '202':
          description: Saved; runtime synchronization pending or failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillSelection"}
        default:
          description: Error; account session required, scoped Sandbox API keys rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/oauth/callback:
    get:
      operationId: CompleteMCPOAuth
      summary: Complete one-time GitHub OAuth callback in the system browser
      description: Fixed HTTPS callback. State binds the account and PKCE transaction. Does not accept Isodo API keys or return OAuth tokens. Query strings must never be logged.
      tags: [MCP]
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
        - {name: iss, in: query, schema: {type: string}}
      responses:
        '200':
          description: Authorization and tool discovery complete; return to Electron
          content:
            text/plain:
              schema: {type: string}
        default:
          description: Invalid, expired or replayed state; authorization failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/mcp/custom:
    post:
      tags: [MCP]
      operationId: CreateCustomMCP
      security: [{SessionCookie: []}, {BearerAuth: []}]
      summary: 添加账号私有 HTTPS MCP 并验证工具发现
      description: 仅登录会话；支持无认证和 Bearer Token。Token 仅加密保存在 Control，不返回或传入 Guest。只允许公网 HTTPS 443，拒绝重定向、内网与 DNS 重绑定。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomMCPCreate'}
      responses:
        '201':
          description: 已验证并保存私有 MCP
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPCatalogEntry'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/mcp/custom/{customID}:
    parameters:
      - {name: customID, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [MCP]
      operationId: DeleteCustomMCP
      security: [{SessionCookie: []}, {BearerAuth: []}]
      summary: 删除自己的私有 MCP 并撤销全部沙箱绑定
      responses:
        '204': {description: 已删除或已不存在}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/mcp/catalog:
    get:
      operationId: ListMCPCatalog
      summary: List available MCP services
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: List available MCP services
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPCatalogList"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/catalog/{marketID}:
    get:
      operationId: GetMCPCatalog
      summary: Get MCP catalog service
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Get MCP catalog service
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPCatalogList"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/favorites:
    get:
      operationId: ListMCPFavorites
      summary: List account favorites
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: List account favorites
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPCatalogList"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/favorites/{marketID}:
    put:
      operationId: FavoriteMCP
      summary: Favorite without authorizing
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: Favorite without authorizing
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: UnfavoriteMCP
      summary: Unfavorite without revoking OAuth
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: Unfavorite without revoking OAuth
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/connections/{marketID}:
    get:
      operationId: GetMCPOAuthConnection
      summary: Get connection without secrets
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Get connection without secrets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPOAuthConnection"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: DisconnectMCPOAuth
      summary: Disconnect and invalidate sandbox calls
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: Disconnect and invalidate sandbox calls
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/connections/{marketID}/authorize:
    post:
      operationId: StartMCPOAuth
      summary: Start or reconnect using registered App and PKCE
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Start or reconnect using registered App and PKCE
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPOAuthStart"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/connections/{marketID}/tools:
    get:
      operationId: ListMCPTools
      summary: Discover allowed upstream tools
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Discover allowed upstream tools
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPToolList"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/mcp/oauth/transactions/{transactionID}:
    get:
      operationId: GetMCPOAuthTransaction
      summary: Poll account authorization transaction
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: transactionID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Poll account authorization transaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPOAuthTransaction"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: CancelMCPOAuthTransaction
      summary: Cancel authorization transaction
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: transactionID, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: Cancel authorization transaction
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/mcp:
    get:
      operationId: ListSandboxMCPBindings
      summary: List explicit sandbox bindings
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: List explicit sandbox bindings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPBindingList"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/mcp/{marketID}:
    put:
      operationId: BindSandboxMCP
      summary: Bind authorized MCP and sync Codex config
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Bind authorized MCP and sync Codex config
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        "202":
          description: Binding committed but config pending or failed; retry sync
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: UnbindSandboxMCP
      summary: Revoke binding before syncing config
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Revoke binding before syncing config
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        "202":
          description: Binding committed but config pending or failed; retry sync
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/mcp/{marketID}/sync:
    post:
      operationId: SyncSandboxMCP
      summary: Apply saved MCP config; Agent restart required
      tags: [MCP]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      parameters:
        - {name: sandboxID, in: path, required: true, schema: {type: string}}
        - {name: marketID, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Apply saved MCP config; Agent restart required
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        "202":
          description: Binding committed but config pending or failed; retry sync
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPSync"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/files:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
      - {name: path, in: query, required: true, schema: {type: string}, description: Canonical absolute path under /workspace}
    post:
      operationId: UploadSandboxFile
      summary: Upload and atomically commit one file
      description: Defaults to overwrite=true. One multipart part named file, up to 256 MiB. Upload bytes are staged in bounded private temporary storage before forwarding through Node and Guest. Success means Guest confirmed the SHA256 and atomic commit. COMMIT_UNKNOWN must be verified by reading the target before retrying.
      tags: [Files]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      parameters:
        - {name: overwrite, in: query, schema: {type: boolean, default: true}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: Guest confirmed atomic commit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileWriteResult"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      operationId: DownloadSandboxFile
      summary: Download a verified binary file
      description: Stages at most 256 MiB in private temporary storage and verifies the Guest completion digest before responding. X-Content-SHA256 describes the complete response body.
      tags: [Files]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      responses:
        "200":
          description: Verified binary content
          headers:
            X-Content-SHA256: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/directories:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    post:
      operationId: MakeSandboxDirectory
      summary: Create a workspace directory
      tags: [Files]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
                parents: {type: boolean, default: true}
      responses:
        "200":
          description: Directory exists
          content:
            application/json:
              schema: {type: object, required: [path], properties: {path: {type: string}}}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/injections:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    get:
      operationId: GetSandboxInjections
      summary: Read masked host-side injection configuration
      tags: [Sandboxes]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: Masked configuration; never contains secret material
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SandboxInjectionState"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      operationId: SetSandboxInjections
      summary: Replace sandbox host-side injection rules
      description: Interactive owner authorization required. Material is forwarded only over Node mTLS and never written into Guest files. Lifecycle revision is fenced by Control and Node.
      tags: [Sandboxes]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules: {type: array, maxItems: 32, items: {$ref: "#/components/schemas/SandboxInjection"}}
      responses:
        "200":
          description: Masked applied configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SandboxInjectionState"}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/credential-documents/{kind}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string}}
    get:
      operationId: ListCredentialDocuments
      summary: List encrypted account credential configurations
      description: Interactive login required. Kind is agents or sandboxes. Values are decrypted only for the owning account.
      tags: [Credentials]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "200":
          description: Configurations owned by the current account
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, value]
                      properties:
                        id: {type: string}
                        value: {type: object, additionalProperties: true}
        default:
          description: Authentication, validation or storage error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/credential-documents/{kind}/{id}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string}}
      - {name: id, in: path, required: true, schema: {type: string, maxLength: 160}}
    put:
      operationId: PutCredentialDocument
      summary: Save an account Agent configuration or sandbox credential selection
      description: Agent values include id, name, agent, connectionId, modelNames, defaultModel, filePath, content and updatedAt. Sandbox values include agentIds, credentialIds and the applied models snapshot. Agent references must belong to the authenticated account. API keys cannot manage these records.
      tags: [Credentials]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: Configuration persisted with encryption at rest
          content:
            application/json:
              schema:
                type: object
                required: [id, value]
                properties:
                  id: {type: string}
                  value: {type: object, additionalProperties: true}
        default:
          description: Authentication, validation or storage error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: DeleteCredentialDocument
      summary: Delete one configuration owned by the current account
      tags: [Credentials]
      security: [{SessionCookie: []}, {BearerAuth: []}]
      responses:
        "204": {description: Configuration deleted; referenced API credential is retained}
        default:
          description: Authentication, validation or storage error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes:
    get:
      operationId: ListSandboxes
      summary: List sandboxes
      description: Returns sandboxes owned by the authenticated user. Use `limit` and `offset` to paginate results.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxList"
        default:
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
    post:
      operationId: CreateSandbox
      summary: Create a sandbox
      description: Creates a sandbox for the authenticated user. The sandbox is created in its initial desired state; runtime
        availability depends on the configured backend.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandbox"
  /v1/sandboxes/{sandboxID}:
    get:
      operationId: GetSandbox
      summary: Get a sandbox
      description: Returns one sandbox owned by the authenticated user. A sandbox owned by another user is reported as not found.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
    patch:
      operationId: UpdateSandbox
      summary: Update a sandbox
      description: Updates mutable sandbox metadata for a sandbox owned by the authenticated user.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSandbox"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: DeleteSandbox
      summary: Delete a sandbox
      description: Requests Node cleanup. The resource remains readable until cleanup completes; repeated deletion returns the same action while pending or completed. Missing resources return 204.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: Cleanup accepted or its current result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "204":
          description: Sandbox does not exist
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/start:
    post:
      operationId: StartSandbox
      summary: Start a stopped sandbox
      description: Requests a disk-preserving cold start for a stopped cloud sandbox owned by the authenticated user. The operation is asynchronous; poll the sandbox until observed_state becomes running.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: Start accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/stop:
    post:
      operationId: StopSandbox
      summary: Stop a running sandbox
      description: Requests a graceful stop for a cloud sandbox owned by the authenticated user while preserving its instance disks. The operation is asynchronous; poll the sandbox until observed_state becomes stopped.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "202":
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/app:
    get:
      operationId: GetSandboxApp
      summary: Open a sandbox application
      description: Creates a short-lived Agent workbench pairing link for an authenticated sandbox owner and redirects the browser to the sandbox application.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "303":
          description: Redirects to the sandbox application's Agent workbench pairing page. The pairing credential is short-lived and is carried in the URL fragment.
          headers:
            Location:
              schema:
                type: string
        "401":
          description: Authentication is required
        "403":
          description: An interactive Isodo session is required
        "404":
          description: Sandbox not found
        "409":
          description: Sandbox is not running
        "501":
          description: The configured sandbox backend does not support application links
        "502":
          description: The Node returned an invalid or unreachable application link
        "503":
          description: Sandbox application service is unavailable
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/app-link:
    post:
      operationId: CreateSandboxAppLink
      summary: Create a sandbox application link
      description: Creates a short-lived Agent workbench pairing link for an authenticated sandbox owner and returns it as JSON. Desktop clients and SDKs use this endpoint; browsers can use `GET /v1/sandboxes/{sandboxID}/app` instead. The pairing credential is carried in the `pairing_url` fragment and is never sent to the Isodo API.
      tags:
        - Sandboxes
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: The sandbox application link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxAppLink"
        "401":
          description: Authentication is required
        "403":
          description: An interactive Isodo session is required
        "404":
          description: Sandbox not found
        "409":
          description: Sandbox is not running
        "501":
          description: The configured sandbox backend does not support application links
        "502":
          description: The Node returned an invalid or unreachable application link
        "503":
          description: Sandbox application service is unavailable
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
  /v1/sandboxes/{sandboxID}/previews:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    post:
      operationId: CreateSandboxPreview
      summary: Authorize a sandbox HTTP port preview
      description: Requires a running remote CHV sandbox and sandboxes:preview for API keys. Unconfigured ports are public and return a directly usable URL. Private ports return a five-minute authorization_url bound to the account, policy revision and current Guest runtime. Runtime ports 31024, 31080, 38080 and legacy 1024, 1080, 8080 are prohibited. Stop, Start, Delete and policy changes revoke private grants.
      tags: [Previews]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              additionalProperties: false
              properties:
                port: {type: integer, minimum: 1, maximum: 65535}
      responses:
        "201":
          description: Public ports return a directly accessible url. Private ports additionally return a short-lived authorization_url and expires_at; treat authorization_url as a secret.
          content:
            application/json:
              schema:
                type: object
                required: [url, visibility]
                properties:
                  visibility: {type: string, enum: [public, private]}
                  url: {type: string, format: uri}
                  authorization_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        default:
          description: Authentication, port validation or runtime error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/previews/{port}:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
      - {name: port, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 65535}}
    get:
      operationId: GetSandboxPortPreview
      summary: Get a sandbox HTTP port visibility
      description: Requires ownership and sandboxes:read. Unconfigured ports default to public. Runtime ports 31024, 31080, 38080 and legacy 1024, 1080, 8080 are prohibited.
      tags: [Previews]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      responses:
        "200":
          description: Current persisted policy or the public default.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortPreviewPolicy"}
        default:
          description: Request, ownership or storage error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      operationId: SetSandboxPortPreview
      summary: Change a sandbox HTTP port visibility
      description: Requires ownership and sandboxes:preview. Persisted across Stop/Start and removed on Delete. New requests read the committed policy; active local streams are cancelled before acknowledgment and other Gateway instances revalidate at most every 100ms. T3 authentication is unchanged.
      tags: [Previews]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PortPreviewPolicy"}
      responses:
        "200":
          description: Persisted policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortPreviewPolicy"}
        default:
          description: Request, ownership or storage error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{sandboxID}/commands/run:
    parameters:
      - {name: sandboxID, in: path, required: true, schema: {type: string}}
    post:
      operationId: RunSandboxCommand
      summary: Run a bounded non-interactive command inside a sandbox Guest
      description: Executes argv inside the running Guest (never on a host Shell). Idempotency-Key is required, must contain 8-128 safe ASCII characters, and must be reused when retrying the same request. A command with a nonzero exit code still returns HTTP 200.
      tags: [Commands]
      security: [{SessionCookie: []}, {BearerAuth: []}, {APIKeyAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandRunRequest"}
      responses:
        "200":
          description: Guest completed the command and returned its exit status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandRunResult"}
        default:
          description: Authentication, execution or runtime error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/injection-rules:
    get:
      operationId: ListInjectionRules
      summary: List account injection rules
      description: Returns the authenticated account's persistent injection rules. Secrets are never returned; only a short masked hint is exposed.
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionRuleList"
        default:
          description: Request, authentication or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: CreateInjectionRule
      summary: Create an account injection rule
      description: Creates a persistent, account-level rule that the owner can attach to sandboxes. The secret is sealed before storage.
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionRule"
        default:
          description: Request, authentication or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInjectionRule"
  /v1/injection-rules/{ruleID}:
    parameters:
      - name: ruleID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetInjectionRule
      summary: Get an account injection rule
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionRule"
        default:
          description: Request, authentication or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: UpdateInjectionRule
      summary: Update an account injection rule
      description: Updates a rule owned by the authenticated account. Omit secret to keep the existing sealed value.
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionRule"
        default:
          description: Request, authentication or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInjectionRule"
    delete:
      operationId: DeleteInjectionRule
      summary: Delete an account injection rule
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Success
        default:
          description: Request, authentication or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/injection-rules/{ruleID}/material:
    parameters:
      - name: ruleID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetInjectionRuleMaterial
      summary: Read injection material
      description: Returns the plaintext header/key for the authenticated owner so a trusted local runtime can apply it. The response is never cached; secrets are never logged.
      tags:
        - Secure Connections
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionRuleMaterial"
        default:
          description: Request, authentication or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/system-templates:
    get:
      operationId: ListSystemTemplates
      summary: List platform default templates
      tags:
        - Templates
      security: &a1
        - SessionCookie: []
        - BearerAuth: []
        - APIKeyAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        default: &a2
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - &a3
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - &a4
          name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
  /v1/templates:
    get:
      operationId: ListTemplates
      summary: List templates visible to the authenticated user
      tags:
        - Templates
      security: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        default: *a2
      parameters:
        - *a3
        - *a4
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - owned
              - public
              - system
              - available
            default: owned
    post:
      operationId: CreateTemplate
      summary: Create a personal template
      tags:
        - Templates
      security: *a1
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplate"
  /v1/templates/{templateID}:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetTemplate
      summary: Get a template
      tags:
        - Templates
      security: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
    patch:
      operationId: UpdateTemplate
      summary: Update an owned template
      tags:
        - Templates
      security: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTemplate"
    delete:
      operationId: DeleteTemplate
      summary: Delete an owned template
      tags:
        - Templates
      security: *a1
      responses:
        "204":
          description: Success
        default: *a2
  /v1/templates/{templateID}/builds:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: CreateTemplateBuild
      summary: Queue an immutable template build
      tags:
        - Templates
      security: *a1
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateBuild"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRecipe"
  /v1/templates/{templateID}/builds/{buildID}:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
      - name: buildID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetTemplateBuild
      summary: Get template build status
      tags:
        - Templates
      security: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateBuild"
        default: *a2
  /v1/templates/{templateID}/tags/{tag}:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
      - name: tag
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetTemplateTag
      summary: Resolve a Ready build tag
      tags:
        - Templates
      security: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateTag"
        default: *a2
    put:
      operationId: SetTemplateTag
      summary: Atomically publish a Ready build under a tag
      tags:
        - Templates
      security: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateTag"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTemplateTag"
    delete:
      operationId: DeleteTemplateTag
      summary: Remove a template build tag
      tags:
        - Templates
      security: *a1
      responses:
        "204":
          description: Success
        default: *a2
  /v1/templates/{templateID}/fork:
    parameters:
      - name: templateID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: ForkTemplate
      summary: Fork an accessible Ready build into a personal template
      tags:
        - Templates
      security: *a1
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkTemplate"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: isodo_session
    BearerAuth:
      type: http
      scheme: bearer
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    SkillCreate:
      type: object
      additionalProperties: false
      required: [name, description, body]
      properties:
        name: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
        description: {type: string, minLength: 1, maxLength: 1024}
        body: {type: string, minLength: 1, maxLength: 32768}
    SkillEntry:
      allOf:
        - {$ref: '#/components/schemas/SkillCreate'}
        - type: object
          required: [id, source, favorite]
          properties:
            id: {type: string, format: uuid}
            source: {type: string, enum: [market, personal]}
            favorite: {type: boolean}
    SkillCatalog:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SkillEntry'}}
    SkillSelectionInput:
      type: object
      additionalProperties: false
      required: [skill_ids]
      properties:
        skill_ids: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, format: uuid}}
    SkillSelection:
      allOf:
        - {$ref: '#/components/schemas/SkillSelectionInput'}
        - type: object
          required: [version, applied_version, sync_status, restart_required]
          properties:
            version: {type: integer, format: int64}
            applied_version: {type: integer, format: int64}
            sync_status: {type: string, enum: [pending, applied, failed]}
            restart_required: {type: boolean}

    CustomMCPCreate:
      type: object
      additionalProperties: false
      required: [name, endpoint, auth_kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 240}
        endpoint: {type: string, format: uri, maxLength: 2048}
        auth_kind: {type: string, enum: [none, bearer]}
        token: {type: string, maxLength: 4096, writeOnly: true}
    MCPCatalogEntry:
      type: object
      required: [market_mcp_id, name, provider, description, endpoint, transport, auth_kind, favorite, status, oauth_configured]
      properties:
        market_mcp_id: {type: string}
        name: {type: string}
        provider: {type: string}
        description: {type: string}
        endpoint: {type: string}
        transport: {type: string, enum: [streamable-http]}
        auth_kind: {type: string, enum: [oauth2, none, bearer]}
        source: {type: string, enum: [market, custom]}
        custom_server_id: {type: string, format: uuid}
        favorite: {type: boolean}
        status: {type: string, enum: [connected, expired, disconnected, failed]}
        oauth_connection_id: {type: string, nullable: true}
        oauth_configured: {type: boolean}
    MCPCatalogList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MCPCatalogEntry'}}
    MCPTool:
      type: object
      required: [name, inputSchema]
      properties:
        name: {type: string}
        description: {type: string}
        inputSchema: {type: object, additionalProperties: true}
    MCPToolList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MCPTool'}}
    MCPOAuthConnection:
      type: object
      required: [status]
      properties:
        market_mcp_id: {type: string}
        oauth_connection_id: {type: string}
        status: {type: string, enum: [connected, expired, disconnected, failed]}
        tools: {type: array, items: {$ref: '#/components/schemas/MCPTool'}}
        expires_at: {type: string, format: date-time, nullable: true}
    MCPOAuthStart:
      type: object
      required: [transaction_id, authorization_url, expires_at]
      properties:
        transaction_id: {type: string}
        authorization_url: {type: string}
        expires_at: {type: string, format: date-time}
    MCPOAuthTransaction:
      type: object
      required: [transaction_id, status, expires_at]
      properties:
        transaction_id: {type: string}
        status: {type: string, enum: [pending, processing, connected, failed, cancelled, expired]}
        expires_at: {type: string, format: date-time}
    MCPBinding:
      type: object
      required: [sandbox_binding_id, market_mcp_id, sync_status, status]
      properties:
        sandbox_binding_id: {type: string}
        market_mcp_id: {type: string}
        oauth_connection_id: {type: string}
        custom_server_id: {type: string, format: uuid}
        sync_status: {type: string, enum: [pending, applied, failed]}
        status: {type: string, enum: [connected, expired, disconnected, failed]}
    MCPBindingList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MCPBinding'}}
    MCPSync:
      type: object
      required: [sync_status, restart_required]
      properties:
        sync_status: {type: string, enum: [pending, applied, failed]}
        restart_required: {type: boolean}
        message: {type: string}
    PortPreviewPolicy:
      type: object
      additionalProperties: false
      required: [visibility]
      properties:
        visibility: {type: string, enum: [public, private], default: public}
    FileWriteResult:
      type: object
      required: [path, bytes, sha256]
      properties:
        path: {type: string}
        bytes: {type: integer, format: int64}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    SandboxInjection:
      type: object
      required: [key, name, kind, spec]
      properties:
        key: {type: string}
        name: {type: string}
        kind: {type: string, enum: [persistent, one-off]}
        persistent_id: {type: string}
        secret_hint: {type: string, readOnly: true}
        spec:
          type: object
          required: [type]
          properties:
            type: {$ref: "#/components/schemas/InjectionRuleType"}
            base_url: {type: string}
            header_name: {type: string}
            if_headers: {type: object, additionalProperties: {type: string}}
            if_queries: {type: object, additionalProperties: {type: string}}
        secret:
