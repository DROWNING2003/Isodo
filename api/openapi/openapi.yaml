---
openapi: 3.0.3
info:
  title: Isodo Control API
  version: 0.1.0
  description: Control-plane API for browser login, sessions, API-key management,
    and health checks.
paths:
  "/auth/login":
    get:
      operationId: Login
      tags:
      - Web
      security: []
      responses:
        '302':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/auth/callback":
    get:
      operationId: Callback
      tags:
      - Web
      security: []
      responses:
        '302':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/auth/me":
    get:
      operationId: GetSession
      tags:
      - Web
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/auth/logout":
    post:
      operationId: Logout
      tags:
      - Web
      security:
      - SessionCookie: []
      responses:
        '204':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/api-keys":
    get:
      operationId: ListAPIKeys
      tags:
      - Keys
      security:
      - SessionCookie: []
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/APIKeyList"
        default:
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: CreateAPIKey
      tags:
      - Keys
      security:
      - SessionCookie: []
      - BearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedAPIKey"
        default:
          description: Request, authentication, authorization or server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAPIKey"
  "/v1/api-keys/{keyID}":
    delete:
      operationId: RevokeAPIKey
      tags:
      - Keys
      security:
      - SessionCookie: []
      - BearerAuth: []
      responses:
        '204':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: keyID
        in: path
        required: true
        schema:
          type: string
  "/healthz":
    get:
      operationId: Health
      tags:
      - Web
      security: []
      responses:
        '200':
          description: Process is serving; not a database readiness probe.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: isodo_session
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        provider:
          type: string
      required:
      - name
      - provider
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          "$ref": "#/components/schemas/Account"
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - user
      - csrf_token
      - expires_at
    APIKeyScope:
      type: string
      enum:
      - sandboxes:read
      - sandboxes:write
      - templates:read
      - templates:write
      x-go-type: string
    APIKey:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          x-go-name: ID
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            "$ref": "#/components/schemas/APIKeyScope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - name
      - prefix
      - scopes
      - created_at
      - expires_at
      - last_used_at
      - revoked_at
    CreateAPIKey:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/APIKeyScope"
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
      - scopes
    CreatedAPIKey:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - prefix
      - scopes
      - created_at
      - expires_at
      - last_used_at
      - revoked_at
      - api_key
      properties:
        id:
          type: string
          x-go-name: ID
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            "$ref": "#/components/schemas/APIKeyScope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        api_key:
          type: string
          x-go-name: Secret
    APIKeyList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/APIKey"
      required:
      - items
