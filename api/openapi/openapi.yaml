---
openapi: 3.0.3
info:
  title: Isodo 账号控制 API
  version: 0.1.0
  description: 提供浏览器登录、会话、API Key 管理和健康检查的控制面接口。
paths:
  "/auth/login":
    get:
      operationId: Login
      tags:
        - 登录会话
      security: []
      responses:
        '302':
          description: 请求成功
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      summary: 发起网页登录
  "/auth/callback":
    get:
      operationId: Callback
      tags:
        - 登录会话
      security: []
      responses:
        '302':
          description: 请求成功
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      summary: 完成登录回调
  "/auth/me":
    get:
      operationId: GetSession
      tags:
        - 登录会话
      security:
        - SessionCookie: []
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      summary: 查询当前登录会话
  "/auth/logout":
    post:
      operationId: Logout
      tags:
        - 登录会话
      security:
        - SessionCookie: []
      responses:
        '204':
          description: 请求成功
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      summary: 退出登录
  "/v1/api-keys":
    get:
      operationId: ListAPIKeys
      tags:
        - API Key
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/APIKeyList"
        default:
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      summary: 列出 API Key
    post:
      operationId: CreateAPIKey
      tags:
        - API Key
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '201':
          description: 请求成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedAPIKey"
        default:
          description: 请求、认证、权限或服务端错误
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAPIKey"
      summary: 创建 API Key
  "/v1/api-keys/{keyID}":
    delete:
      operationId: RevokeAPIKey
      tags:
        - API Key
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '204':
          description: 请求成功
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
        - name: keyID
          in: path
          required: true
          schema:
            type: string
      summary: 撤销 API Key
  "/healthz":
    get:
      operationId: Health
      tags:
        - 登录会话
      security: []
      responses:
        '200':
          description: 进程正在提供服务；此接口不代表数据库已就绪。
          content:
            text/plain:
              schema:
                type: string
      summary: 查询服务健康状态
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: isodo_session
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        provider:
          type: string
      required:
        - name
        - provider
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          "$ref": "#/components/schemas/Account"
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
        - user
        - csrf_token
        - expires_at
    APIKeyScope:
      type: string
      enum:
        - sandboxes:read
        - sandboxes:write
        - sandboxes:execute
        - sandboxes:preview
        - templates:read
        - templates:write
      x-go-type: string
    APIKey:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          x-go-name: ID
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            "$ref": "#/components/schemas/APIKeyScope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - prefix
        - scopes
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
    CreateAPIKey:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/APIKeyScope"
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
        - name
        - scopes
    CreatedAPIKey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - prefix
        - scopes
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
        - api_key
      properties:
        id:
          type: string
          x-go-name: ID
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            "$ref": "#/components/schemas/APIKeyScope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        api_key:
          type: string
          x-go-name: Secret
    APIKeyList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/APIKey"
      required:
        - items
