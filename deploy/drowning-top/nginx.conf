worker_processes 2;
pid /opt/isodo/nginx/run/nginx.pid;
error_log /opt/isodo/nginx/logs/error.log warn;
events { worker_connections 2048; }
http {
    # Paths can contain signed preview credentials. Never log URI, query or cookies.
    log_format safe '$remote_addr $host $request_method $status $body_bytes_sent $request_time';
    access_log /opt/isodo/nginx/logs/access.log safe;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $host $isodo_backend {
        default '';
        api.drowning.top http://10.210.10.32:5004;
        docs.drowning.top http://127.0.0.1:13000;
        auth.drowning.top http://10.210.10.32:18000;
        "~^\d+-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\.drowning\.top$" http://10.210.10.32:5004;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
        ssl_certificate /etc/ssl/drowning.top/fullchain.pem;
        ssl_certificate_key /etc/ssl/drowning.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ISODO:10m;
        ssl_session_tickets off;
    server {
        listen 10.210.10.32:18443 ssl default_server;
        server_name _;
        if ($isodo_backend = '') { return 421; }
        client_max_body_size 256m;
        client_body_timeout 300s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location / {
            proxy_pass $isodo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 18443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }
    }
    server {
        listen 10.210.10.32:18443 ssl;
        server_name web.drowning.top;
        root /opt/isodo/web/current;
        client_max_body_size 256m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location ~ ^/(auth|v1)/ {
            proxy_pass http://10.210.10.32:5004;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 18443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Forwarded '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location ~ /\. { return 404; }
        location ~ \.map$ { return 404; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
    }
}
